name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  v2-stellar:
    name: v2 Stellar contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2/stellar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: v2/stellar

      - name: Test
        run: cargo test --locked

      - name: Build Wasm
        run: cargo build --locked --release --target wasm32v1-none
