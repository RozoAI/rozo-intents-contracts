name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  v2-stellar:
    name: v2 Stellar contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2/stellar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: 1.96.0
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: v2/stellar

      - name: Test
        run: cargo test --locked

      - name: Build Wasm
        run: cargo build --locked --release --target wasm32v1-none

  v2-evm:
    name: v2 EVM contracts (Arc Foundry)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2/evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # Arc Foundry is not installable through foundryup / foundry-toolchain; pin the release archive + sha256.
      - name: Install Arc Foundry v0.8.0-2
        run: |
          set -euo pipefail
          curl -fsSL -o arc-foundry.tar.gz https://github.com/circlefin/arc-foundry/releases/download/v0.8.0-2/arc-foundry-v0.8.0-2-x86_64-unknown-linux-gnu.tar.gz
          echo "088bdb96a84418b757f9825d491e702792f1d1d1e29a9145af305a6600a79556  arc-foundry.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf arc-foundry.tar.gz
          mv forge "$HOME/.local/bin/arc-forge" && mv cast "$HOME/.local/bin/arc-cast" && mv anvil "$HOME/.local/bin/arc-anvil"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arc-forge" --version

      - name: Build (frozen settings) and assert the frozen bytecode hashes
        run: |
          set -euo pipefail
          arc-forge build
          CC=$(jq -r .bytecode.object out/MPForwarderFactoryV2.sol/MPForwarderFactoryV2.json)
          RT=$(jq -r .deployedBytecode.object out/MPForwarderFactoryV2.sol/MPForwarderFactoryV2.json)
          test "$(arc-cast keccak "$CC")" = "0x46d6f8de6a89d4f6f2310335bf207c5b691c4a3e6363ad77fe53d73531627903"
          test "$(arc-cast keccak "$RT")" = "0x4a6726a2a9012bb4f1bfe84bf7c12edb0b0aebb5a343e657db54a806ff0564de"

      - name: Test
        run: arc-forge test
