[workspace]
resolver = "2"
members = [
    "forwarder",
    "intent_bridge",
]

[workspace.dependencies]
soroban-sdk = "22.0.11"

# Profile settings must be in workspace root to be effective
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
