# Reproducible build profile for MPForwarderFactoryV2 / MPForwarderV2.
# The factory address F2 is CREATE2(Nick's factory, SALT_F2, keccak256(creationCode)).
# Changing ANY of: solc version, optimizer, optimizer_runs, via_ir, evm_version,
# bytecode_hash, cbor_metadata, or a single byte of src/ changes the creation
# bytecode and therefore F2, P2 and every derived payment address.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = false
auto_detect_solc = false
offline = false
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = []
# Compiler cache must not change output; kept on for speed.
cache = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
arc_testnet = "https://rpc.testnet.arc.io"
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"
